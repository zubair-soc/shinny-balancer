<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Database Manager - Shinny Team Balancer</title>
    <link rel="stylesheet" href="ui.css">
    <style>
        /* Database page-specific styles */
        .search-bar {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 14px 20px;
            color: #e8eaed;
            font-size: 15px;
            width: 100%;
            margin-bottom: 20px;
        }

        .search-bar:focus {
            outline: none;
            border-color: #60a5fa;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: rgba(96, 165, 250, 0.1);
            border: 1px solid rgba(96, 165, 250, 0.2);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #60a5fa;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 13px;
            color: #9ca3af;
        }

        .editable-rating {
            background: rgba(96, 165, 250, 0.15);
            border: 1px solid rgba(96, 165, 250, 0.3);
            border-radius: 6px;
            padding: 4px 10px;
            color: #60a5fa;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .editable-rating:hover {
            background: rgba(96, 165, 250, 0.25);
        }

        .rating-input {
            width: 60px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #60a5fa;
            border-radius: 6px;
            padding: 4px 8px;
            color: #e8eaed;
            text-align: center;
            font-weight: 600;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .table-actions {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗂️ Database Manager</h1>
            <a href="index.html" class="back-button">← Back to Balancer</a>
        </div>

        <div class="toolbar">
            <input type="text" id="searchBox" class="search-box" placeholder="Search players...">
            <button class="button" onclick="showAddModal()">+ Add Player</button>
            <button class="button button-secondary" onclick="exportCSV()">Export CSV</button>
            <div class="stats">
                <span id="playerCount">0 players</span>
                <span id="filteredCount"></span>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th onclick="sortTable('name')">Name ↕</th>
                        <th onclick="sortTable('rating')">Rating ↕</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="playerTableBody">
                    <tr>
                        <td colspan="3" class="loading">Loading players...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add Player Modal -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Add New Player</div>
            <div class="form-group">
                <label>Player Name</label>
                <input type="text" id="newPlayerName" placeholder="Enter player name">
            </div>
            <div class="form-group">
                <label>Rating (0-20)</label>
                <input type="number" id="newPlayerRating" placeholder="Enter rating" min="0" max="20">
            </div>
            <div class="modal-buttons">
                <button class="button button-secondary" onclick="closeAddModal()">Cancel</button>
                <button class="button" onclick="addPlayer()">Add Player</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <script>
        // Supabase configuration
        const SUPABASE_URL = 'https://fqbtfgkwhnfyodinjvcn.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxYnRmZ2t3aG5meW9kaW5qdmNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA0MzIzODAsImV4cCI6MjA4NjAwODM4MH0.dVank1VxQ4-9EsQ7ekwSRs5Vu9V2rQLgVmN01iBDYHs';
        
        let supabaseClient;
        let allPlayers = [];
        let filteredPlayers = [];
        let sortColumn = 'name';
        let sortDirection = 'asc';

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof window.supabase !== 'undefined') {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                loadPlayers();
            } else {
                alert('Database connection failed. Please refresh.');
            }

            // Search functionality
            document.getElementById('searchBox').addEventListener('input', (e) => {
                filterPlayers(e.target.value);
            });
        });

        async function loadPlayers() {
            try {
                const { data, error } = await supabaseClient
                    .from('players')
                    .select('*')
                    .order('name');

                if (error) throw error;

                allPlayers = data;
                filteredPlayers = [...allPlayers];
                renderTable();
                updateStats();
            } catch (error) {
                console.error('Error loading players:', error);
                document.getElementById('playerTableBody').innerHTML = 
                    '<tr><td colspan="3" class="empty-state"><h3>Failed to load players</h3><p>Please refresh the page</p></td></tr>';
            }
        }

        function filterPlayers(searchTerm) {
            const term = searchTerm.toLowerCase().trim();
            if (!term) {
                filteredPlayers = [...allPlayers];
            } else {
                filteredPlayers = allPlayers.filter(p => 
                    p.name.toLowerCase().includes(term)
                );
            }
            renderTable();
            updateStats();
        }

        function sortTable(column) {
            if (sortColumn === column) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortColumn = column;
                sortDirection = 'asc';
            }

            filteredPlayers.sort((a, b) => {
                let aVal = a[column];
                let bVal = b[column];

                if (column === 'name') {
                    aVal = aVal.toLowerCase();
                    bVal = bVal.toLowerCase();
                }

                if (sortDirection === 'asc') {
                    return aVal > bVal ? 1 : -1;
                } else {
                    return aVal < bVal ? 1 : -1;
                }
            });

            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('playerTableBody');
            
            if (filteredPlayers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="empty-state"><h3>No players found</h3><p>Try a different search or add a new player</p></td></tr>';
                return;
            }

            tbody.innerHTML = filteredPlayers.map(player => `
                <tr>
                    <td>${player.name}</td>
                    <td class="rating-cell">${player.rating}</td>
                    <td class="actions">
                        <button class="icon-button" onclick="editRating(${player.id}, '${player.name.replace(/'/g, "\\'")}', ${player.rating})" title="Edit rating">✏️</button>
                        <button class="icon-button delete" onclick="confirmDelete(${player.id}, '${player.name.replace(/'/g, "\\'")}' )" title="Delete player">🗑️</button>
                    </td>
                </tr>
            `).join('');
        }

        function updateStats() {
            document.getElementById('playerCount').textContent = `${allPlayers.length} players`;
            const filtered = document.getElementById('filteredCount');
            if (filteredPlayers.length !== allPlayers.length) {
                filtered.textContent = `(${filteredPlayers.length} shown)`;
            } else {
                filtered.textContent = '';
            }
        }

        // Add Player
        function showAddModal() {
            document.getElementById('addModal').classList.add('active');
            document.getElementById('newPlayerName').value = '';
            document.getElementById('newPlayerRating').value = '';
            document.getElementById('newPlayerName').focus();
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.remove('active');
        }

        async function addPlayer() {
            const name = document.getElementById('newPlayerName').value.trim();
            const rating = parseFloat(document.getElementById('newPlayerRating').value);

            if (!name) {
                alert('Please enter a player name');
                return;
            }

            if (isNaN(rating) || rating < 0 || rating > 20) {
                alert('Please enter a valid rating between 0 and 20');
                return;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('players')
                    .insert([{ name, rating }])
                    .select();

                if (error) throw error;

                allPlayers.push(data[0]);
                allPlayers.sort((a, b) => a.name.localeCompare(b.name));
                filterPlayers(document.getElementById('searchBox').value);
                closeAddModal();
                alert(`✓ Added ${name}`);
            } catch (error) {
                console.error('Error adding player:', error);
                if (error.code === '23505') {
                    alert('A player with this name already exists');
                } else {
                    alert('Failed to add player. Please try again.');
                }
            }
        }

        // Edit Rating
        async function editRating(id, name, currentRating) {
            const newRating = prompt(`Enter new rating for ${name}:`, currentRating);
            
            if (newRating === null) return;
            
            const rating = parseFloat(newRating);
            if (isNaN(rating) || rating < 0 || rating > 20) {
                alert('Please enter a valid rating between 0 and 20');
                return;
            }

            try {
                const { error } = await supabaseClient
                    .from('players')
                    .update({ rating, updated_at: new Date().toISOString() })
                    .eq('id', id);

                if (error) throw error;

                const player = allPlayers.find(p => p.id === id);
                if (player) player.rating = rating;
                
                filterPlayers(document.getElementById('searchBox').value);
            } catch (error) {
                console.error('Error updating rating:', error);
                alert('Failed to update rating. Please try again.');
            }
        }

        // Delete Player
        function confirmDelete(id, name) {
            if (!confirm(`Delete ${name}?\n\nThis cannot be undone.`)) {
                return;
            }
            deletePlayer(id);
        }

        async function deletePlayer(id) {
            try {
                const { error } = await supabaseClient
                    .from('players')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                allPlayers = allPlayers.filter(p => p.id !== id);
                filterPlayers(document.getElementById('searchBox').value);
                alert('✓ Player deleted');
            } catch (error) {
                console.error('Error deleting player:', error);
                alert('Failed to delete player. Please try again.');
            }
        }

        // Export CSV
        function exportCSV() {
            const csv = ['Name,Rating'];
            allPlayers.forEach(p => {
                csv.push(`"${p.name}",${p.rating}`);
            });

            const blob = new Blob([csv.join('\n')], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `shinny-players-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
