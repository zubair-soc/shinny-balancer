<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credits Manager - Shinny of Champions</title>
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Skate Manager">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./icons/skate-manager-192.png">
    <link rel="stylesheet" href="css/credits.css">
</head>
<body>
    <div class="theme-toggle" onclick="toggleTheme()" id="themeToggle">🌙</div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>💳 Credits Manager</h1>
            <div style="display: flex; gap: 12px;">
                <a href="index.html" class="back-button">← Back to Skates</a>
            </div>
        </div>

        <!-- Summary Cards -->
        <div class="summary-cards">
            <div class="summary-card">
                <div class="summary-label">Active Credits</div>
                <div class="summary-value" id="activeCount">0</div>
            </div>
            <div class="summary-card">
                <div class="summary-label">Total Amount</div>
                <div class="summary-value" id="totalAmount">$0</div>
            </div>
            <div class="summary-card">
                <div class="summary-label">Used Credits</div>
                <div class="summary-value" style="color: #6b7280;" id="usedCount">0</div>
            </div>
            <div class="summary-card">
                <div class="summary-label">Players with Credits</div>
                <div class="summary-value" id="playersWithCredits">0</div>
            </div>
        </div>

        <!-- Actions -->
        <div class="actions">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Search by player name..." onkeyup="filterCredits()">
            </div>
            <button class="button" onclick="showAddCreditModal()">➕ Add Credit</button>
            <div class="filter-buttons">
                <button class="filter-btn active" onclick="setFilter('active')">Active</button>
                <button class="filter-btn" onclick="setFilter('all')">All</button>
                <button class="filter-btn" onclick="setFilter('used')">Used</button>
            </div>
        </div>

        <!-- Credits List -->
        <div id="creditsContent">
            <div class="loading">Loading credits...</div>
        </div>
    </div>

    <!-- Edit Credit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Edit Credit</div>
            
            <div class="form-group">
                <label>Player</label>
                <select id="editPlayer">
                    <option value="">Select player...</option>
                </select>
            </div>

            <div class="form-group">
                <label>Amount</label>
                <input type="number" id="editAmount" step="0.01" min="0" placeholder="25.00">
            </div>

            <div class="form-group">
                <label>Reason</label>
                <input type="text" id="editReason" placeholder="Dropped from Skate 234">
            </div>

            <div class="modal-buttons">
                <button class="button button-secondary" onclick="closeEditModal()">Cancel</button>
                <button class="button" onclick="saveCredit()">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Add Credit Modal -->
    <div id="addCreditModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">➕ Add Credit Manually</div>
            
            <div class="form-group">
                <label>Player *</label>
                <select id="addPlayer">
                    <option value="">Select player...</option>
                </select>
            </div>

            <div class="form-group">
                <label>Amount *</label>
                <input type="number" id="addAmount" step="0.01" min="0" placeholder="25.00">
            </div>

            <div class="form-group">
                <label>Reason</label>
                <input type="text" id="addReason" placeholder="Paid for full skate without realizing (optional)">
            </div>

            <div class="modal-buttons">
                <button class="button button-secondary" onclick="closeAddCreditModal()">Cancel</button>
                <button class="button" onclick="createCredit()">Add Credit</button>
            </div>
        </div>
    </div>

    <!-- Apply Credit Modal -->
    <div id="applyCreditModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">💳 Apply Credit to Skate</div>
            
            <div style="margin-bottom: 20px; padding: 12px; background: rgba(var(--primary-rgb), 0.1); border-radius: 8px;">
                <div style="font-weight: 600; margin-bottom: 4px;" id="applyPlayerName"></div>
                <div style="color: var(--primary); font-size: 18px; font-weight: 700;" id="applyAvailableAmount"></div>
            </div>

            <div class="form-group">
                <label>Select Skate to Apply Credit *</label>
                <select id="applySkate">
                    <option value="">Loading skates...</option>
                </select>
            </div>

            <div id="creditPreview" style="display: none; margin-top: 16px; padding: 12px; background: var(--bg-start); border-radius: 8px;">
                <div style="font-weight: 600; margin-bottom: 8px;">Credits to be used (oldest first):</div>
                <div id="creditBreakdown" style="font-size: 13px; color: var(--text-muted);"></div>
                <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--card-border);">
                    <div style="display: flex; justify-content: space-between; font-weight: 600;">
                        <span>Total Applied:</span>
                        <span style="color: var(--primary);" id="totalApplied"></span>
                    </div>
                    <div id="remainingToPay" style="display: flex; justify-content: space-between; margin-top: 4px; color: var(--text-muted); font-size: 13px;"></div>
                </div>
            </div>

            <div class="modal-buttons">
                <button class="button button-secondary" onclick="closeApplyCreditModal()">Cancel</button>
                <button class="button" onclick="confirmApplyCredit()" id="applyButton" disabled>Apply Credit</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/credits.js"></script>
    <script src="js/auth-gate.js"></script>
    <script src="js/pwa.js"></script>
</body>
</html>
