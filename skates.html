<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skate Manager - Shinny Team Balancer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a1128 0%, #1a2744 100%);
            color: #e8eaed;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-buttons {
            display: flex;
            gap: 12px;
        }

        .back-button, .add-button {
            background: rgba(96, 165, 250, 0.1);
            border: 1px solid rgba(96, 165, 250, 0.3);
            color: #60a5fa;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s;
        }

        .add-button {
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            color: white;
            border: none;
        }

        .back-button:hover {
            background: rgba(96, 165, 250, 0.2);
            border-color: rgba(96, 165, 250, 0.5);
        }

        .add-button:hover {
            transform: translateY(-2px);
        }

        .skates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .skate-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .skate-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(96, 165, 250, 0.5);
            transform: translateY(-2px);
        }

        .skate-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #e8eaed;
        }

        .skate-detail {
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 6px;
        }

        .skate-count {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-weight: 600;
        }

        .count-full {
            color: #ef4444;
        }

        .count-ok {
            color: #60a5fa;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a2744;
            border-radius: 16px;
            padding: 30px;
            max-width: 900px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-header {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #e8eaed;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-modal {
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }

        .close-modal:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #e8eaed;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #9ca3af;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input, .form-group select {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 12px 16px;
            color: #e8eaed;
            font-size: 14px;
        }

        .button {
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .button-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .button-danger {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #ef4444;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        .roster-section {
            margin-top: 24px;
        }

        .roster-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .roster-list {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
        }

        .roster-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 6px;
            background: white;
            color: #1a2744;
        }

        .roster-item.goalie {
            background: #fef08a;
        }

        .roster-item.unpaid {
            opacity: 0.6;
            border: 2px dashed #ef4444;
        }

        .roster-item.waitlist {
            background: rgba(255, 255, 255, 0.3);
            color: #9ca3af;
        }

        .roster-item-name {
            font-weight: 500;
        }

        .roster-item-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: rgba(0, 0, 0, 0.1);
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .icon-btn:hover {
            background: rgba(0, 0, 0, 0.2);
        }

        .capacity-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-top: 12px;
            overflow: hidden;
        }

        .capacity-fill {
            height: 100%;
            background: linear-gradient(90deg, #60a5fa, #3b82f6);
            transition: width 0.3s;
        }

        .capacity-full {
            background: linear-gradient(90deg, #ef4444, #dc2626);
        }

        .add-player-form {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .add-player-form input {
            flex: 1;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #9ca3af;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📅 Skate Manager</h1>
            <div class="header-buttons">
                <a href="index.html" class="back-button">← Back to Balancer</a>
                <button class="add-button" onclick="showImportModal()" style="background: rgba(167, 139, 250, 0.1); border: 1px solid rgba(167, 139, 250, 0.3); color: #a78bfa;">📄 Import CSV/ICS</button>
                <button class="add-button" onclick="showCreateModal()">+ Create Skate</button>
            </div>
        </div>

        <!-- Hidden file input for CSV/ICS -->
        <input type="file" id="csvFileInput" accept=".csv,.ics" style="display: none;" onchange="handleFileUpload(event)">

        <div id="skatesContainer" class="skates-grid">
            <div class="loading">Loading skates...</div>
        </div>
    </div>

    <!-- Create/Edit Skate Modal -->
    <div id="skateModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalTitle">Create New Skate</span>
                <button class="close-modal" onclick="closeSkateModal()">×</button>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Skate Number</label>
                    <input type="number" id="skateNumber" placeholder="e.g., 223" oninput="updateSkateTitle()">
                </div>
                <div class="form-group">
                    <label>Tier/Format</label>
                    <select id="skateTier" onchange="handleTierChange()">
                        <option value="">Select tier/format</option>
                        <option value="Tier 1">Tier 1</option>
                        <option value="Tier 2">Tier 2</option>
                        <option value="Tier 3 Beginner">Tier 3 Beginner</option>
                        <option value="Mixed Skill">Mixed Skill</option>
                        <option value="3v3">3v3</option>
                        <option value="Breakfast of Champions">Breakfast of Champions</option>
                        <option value="Skills Development">Skills Development</option>
                        <option value="custom">+ Add Custom Tier</option>
                    </select>
                </div>
            </div>

            <div id="customTierInput" style="display: none; margin-bottom: 16px;">
                <input type="text" id="customTierText" placeholder="Enter custom tier/format" style="width: calc(100% - 120px); margin-right: 8px; background: rgba(0, 0, 0, 0.3); border: 1px solid #60a5fa; border-radius: 8px; padding: 12px 16px; color: #e8eaed; font-size: 14px;">
                <button class="button" onclick="saveCustomTier()" style="padding: 12px 16px; display: inline-block;">Save</button>
                <button class="button button-secondary" onclick="cancelCustomTier()" style="padding: 12px 16px; display: inline-block; margin-left: 4px;">Cancel</button>
            </div>

            <div class="form-group">
                <label>Skate Title (auto-generated)</label>
                <input type="text" id="skateTitle" readonly style="background: rgba(0, 0, 0, 0.5); cursor: not-allowed;">
            </div>

            <div class="form-group">
                <label>Date</label>
                <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px;">
                    <select id="skateMonth" style="background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; padding: 12px 16px; color: #e8eaed; font-size: 14px;">
                        <option value="">Month</option>
                        <option value="1">January</option>
                        <option value="2">February</option>
                        <option value="3">March</option>
                        <option value="4">April</option>
                        <option value="5">May</option>
                        <option value="6">June</option>
                        <option value="7">July</option>
                        <option value="8">August</option>
                        <option value="9">September</option>
                        <option value="10">October</option>
                        <option value="11">November</option>
                        <option value="12">December</option>
                    </select>
                    <select id="skateDay" style="background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; padding: 12px 16px; color: #e8eaed; font-size: 14px;">
                        <option value="">Day</option>
                    </select>
                    <select id="skateYear" style="background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; padding: 12px 16px; color: #e8eaed; font-size: 14px;">
                        <option value="">Year</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Start Time</label>
                    <select id="skateStartTime" style="background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; padding: 12px 16px; color: #e8eaed; font-size: 14px; width: 100%;">
                        <option value="">Select time</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Duration</label>
                    <select id="skateDuration" style="background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; padding: 12px 16px; color: #e8eaed; font-size: 14px; width: 100%;">
                        <option value="">Select duration</option>
                        <option value="60">1:00</option>
                        <option value="75">1:15</option>
                        <option value="90" selected>1:30</option>
                        <option value="105">1:45</option>
                        <option value="120">2:00</option>
                        <option value="135">2:15</option>
                        <option value="150">2:30</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Cost</label>
                    <input type="text" id="skateCost" placeholder="e.g., $25" value="$25">
                </div>
                <div class="form-group">
                    <label>Capacity</label>
                    <input type="number" id="skateCapacity" value="24" min="1">
                </div>
            </div>

            <div class="form-group">
                <label>Location</label>
                <select id="skateLocation">
                    <option value="Terwillegar Recreation Centre">Terwillegar Recreation Centre</option>
                    <option value="Donnan">Donnan</option>
                    <option value="NAIT">NAIT</option>
                    <option value="ZerOne W.E.M.">ZerOne W.E.M.</option>
                    <option value="Meadows Recreation Centre">Meadows Recreation Centre</option>
                    <option value="Rivercree">Rivercree</option>
                </select>
            </div>

            <div class="modal-buttons">
                <button class="button button-secondary" onclick="closeSkateModal()">Cancel</button>
                <button class="button" onclick="saveSkate()">Create Skate</button>
            </div>
        </div>
    </div>

    <!-- View/Edit Roster Modal -->
    <div id="rosterModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="rosterSkateTitle">Skate Details</span>
                <button class="close-modal" onclick="closeRosterModal()">×</button>
            </div>

            <div id="rosterSkateDetails" style="margin-bottom: 24px; padding: 16px; background: rgba(0,0,0,0.3); border-radius: 8px;">
            </div>

            <div class="roster-section">
                <div class="roster-header">
                    <h3>Roster <span id="rosterCount">(0/24)</span></h3>
                    <button class="button" onclick="balanceSkate()">⚖️ Balance This Skate</button>
                </div>

                <div class="add-player-form">
                    <input type="text" id="newPlayerName" placeholder="Player name" onkeypress="if(event.key==='Enter') addPlayerToSkate()">
                    <button class="button" onclick="addPlayerToSkate()">Add Player</button>
                </div>

                <div id="rosterList" class="roster-list"></div>

                <div class="capacity-bar">
                    <div id="capacityFill" class="capacity-fill"></div>
                </div>
            </div>

            <div class="roster-section">
                <div class="roster-header">
                    <h3>Waitlist <span id="waitlistCount">(0)</span></h3>
                </div>

                <div class="add-player-form">
                    <input type="text" id="newWaitlistName" placeholder="Player name" onkeypress="if(event.key==='Enter') addToWaitlist()">
                    <button class="button button-secondary" onclick="addToWaitlist()">Add to Waitlist</button>
                </div>

                <div id="waitlistList" class="roster-list"></div>
            </div>

            <div class="modal-buttons">
                <button class="button" onclick="showEditSkateModal()" style="background: rgba(96, 165, 250, 0.1); border: 1px solid rgba(96, 165, 250, 0.3); color: #60a5fa;">✏️ Edit Skate</button>
                <button class="button button-danger" onclick="confirmDeleteSkate()">Delete Skate</button>
                <button class="button button-secondary" onclick="closeRosterModal()">Close</button>
            </div>
        </div>
    </div>

    <!-- CSV Import Preview Modal -->
    <div id="csvPreviewModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span>Import Skates from CSV</span>
                <button class="close-modal" onclick="closeCSVPreviewModal()">×</button>
            </div>

            <div id="csvPreviewContent" style="margin-bottom: 20px;">
                <p style="color: #9ca3af; font-size: 14px;">Upload a BenchApp CSV file to import multiple skates at once.</p>
            </div>

            <div class="modal-buttons">
                <button class="button button-secondary" onclick="closeCSVPreviewModal()">Cancel</button>
                <button id="importCSVButton" class="button" onclick="importCSVSkates()" style="display: none;">Import All Skates</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script>
        // Supabase configuration
        const SUPABASE_URL = 'https://fqbtfgkwhnfyodinjvcn.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxYnRmZ2t3aG5meW9kaW5qdmNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA0MzIzODAsImV4cCI6MjA4NjAwODM4MH0.dVank1VxQ4-9EsQ7ekwSRs5Vu9V2rQLgVmN01iBDYHs';
        
        let supabaseClient;
        let allSkates = [];
        let currentSkateId = null;
        let isEditMode = false; // Track if we're editing or creating

        // Format time to 12hr with AM/PM (e.g., "19:45" -> "7:45PM")
        function formatTime(time24) {
            if (!time24) return '';
            const [hours, minutes] = time24.split(':');
            let h = parseInt(hours);
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            return `${h}:${minutes}${ampm}`;
        }

        // Format date (e.g., "2026-02-09" -> "Mon Feb 9")
        function formatDate(dateStr) {
            const date = new Date(dateStr + 'T00:00:00');
            return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof window.supabase !== 'undefined') {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                loadSkates();
            } else {
                alert('Database connection failed. Please refresh.');
            }
        });

        async function loadSkates() {
            try {
                const { data, error } = await supabaseClient
                    .from('skates')
                    .select('*')
                    .order('date', { ascending: true });

                if (error) {
                    console.error('Supabase error:', error);
                    console.error('Error message:', error.message);
                    console.error('Error details:', JSON.stringify(error, null, 2));
                    throw error;
                }

                allSkates = data;
                renderSkates();
            } catch (error) {
                console.error('Error loading skates:', error);
                console.error('Full error:', JSON.stringify(error, null, 2));
                document.getElementById('skatesContainer').innerHTML = 
                    `<div class="empty-state"><h3>Failed to load skates</h3><p>Error: ${error.message || 'Unknown error'}</p><p>Check console for details</p></div>`;
            }
        }

        async function renderSkates() {
            const container = document.getElementById('skatesContainer');
            
            if (allSkates.length === 0) {
                container.innerHTML = '<div class="empty-state"><h3>No skates yet</h3><p>Click "Create Skate" to get started</p></div>';
                return;
            }

            // Get registration counts for each skate
            const skateCounts = {};
            for (const skate of allSkates) {
                const { data } = await supabaseClient
                    .from('skate_registrations')
                    .select('*', { count: 'exact', head: false })
                    .eq('skate_id', skate.id)
                    .eq('is_waitlist', false);
                
                skateCounts[skate.id] = data ? data.length : 0;
            }

            container.innerHTML = allSkates.map(skate => {
                const count = skateCounts[skate.id] || 0;
                const isFull = count >= skate.capacity;
                const countClass = isFull ? 'count-full' : 'count-ok';
                
                return `
                    <div class="skate-card" onclick="openSkate(${skate.id})">
                        <div class="skate-title">${skate.title}</div>
                        <div class="skate-detail">📅 ${formatDate(skate.date)}</div>
                        <div class="skate-detail">🕐 ${formatTime(skate.time_start)}–${formatTime(skate.time_end)}</div>
                        <div class="skate-detail">💰 ${skate.cost}</div>
                        <div class="skate-detail">📍 ${skate.location}</div>
                        ${skate.tier ? `<div class="skate-detail">🏒 ${skate.tier}</div>` : ''}
                        <div class="skate-count ${countClass}">${count}/${skate.capacity} players</div>
                    </div>
                `;
            }).join('');
        }

        function updateSkateTitle() {
            const number = document.getElementById('skateNumber').value;
            const tierSelect = document.getElementById('skateTier');
            const tier = tierSelect.value === 'custom' ? '' : tierSelect.value;
            
            if (number && tier) {
                document.getElementById('skateTitle').value = `Skate ${number} ${tier}`;
            } else if (number) {
                document.getElementById('skateTitle').value = `Skate ${number}`;
            } else {
                document.getElementById('skateTitle').value = '';
            }
        }

        function populateDateDropdowns() {
            // Populate days (1-31)
            const daySelect = document.getElementById('skateDay');
            daySelect.innerHTML = '<option value="">Day</option>';
            for (let i = 1; i <= 31; i++) {
                daySelect.innerHTML += `<option value="${i}">${i}</option>`;
            }

            // Populate years (current year and next year)
            const yearSelect = document.getElementById('skateYear');
            const currentYear = new Date().getFullYear();
            yearSelect.innerHTML = '<option value="">Year</option>';
            yearSelect.innerHTML += `<option value="${currentYear}">${currentYear}</option>`;
            yearSelect.innerHTML += `<option value="${currentYear + 1}">${currentYear + 1}</option>`;
        }

        function populateTimeDropdowns() {
            const times = [];
            
            // Generate times in 15-minute intervals
            for (let hour = 0; hour < 24; hour++) {
                for (let min = 0; min < 60; min += 15) {
                    const h = hour % 12 || 12;
                    const ampm = hour < 12 ? 'AM' : 'PM';
                    const displayTime = `${h}:${min.toString().padStart(2, '0')} ${ampm}`;
                    const valueTime = `${hour.toString().padStart(2, '0')}:${min.toString().padStart(2, '0')}`;
                    times.push({ display: displayTime, value: valueTime });
                }
            }

            const startSelect = document.getElementById('skateStartTime');
            startSelect.innerHTML = '<option value="">Select time</option>';
            
            times.forEach(time => {
                startSelect.innerHTML += `<option value="${time.value}">${time.display}</option>`;
            });
        }

        function handleTierChange() {
            const select = document.getElementById('skateTier');
            
            if (select.value === 'custom') {
                document.getElementById('customTierInput').style.display = 'block';

        async function saveSkate() {
            const skateNumber = document.getElementById('skateNumber').value.trim();

            const day = document.getElementById('skateDay').value;
            const year = document.getElementById('skateYear').value;

            const timeStart = document.getElementById('skateStartTime').value;

            if (!month || !day || !year || !timeStart || !duration || !cost) {
                alert('Please fill in date, start time, duration, and cost');
                return;
            }

            // Calculate end time from start time + duration
            const [hours, minutes] = timeStart.split(':').map(Number);
            const durationMins = parseInt(duration);
            const endDate = new Date(2000, 0, 1, hours, minutes + durationMins);
            const timeEnd = `${endDate.getHours().toString().padStart(2, '0')}:${endDate.getMinutes().toString().padStart(2, '0')}`;

            const title = document.getElementById('skateTitle').value.trim();

            const skateData = {
                title,
                date,
                tier,
                time_start: timeStart,
                time_end: timeEnd,
                cost,
                capacity,
                location
            };

            try {
                if (isEditMode && currentSkateId) {
                    // Update existing skate
                    const { data, error } = await supabaseClient
                        .from('skates')
                        .update(skateData)
                        .eq('id', currentSkateId)
                        .select();

                    await loadSkates();

                        .from('skates')
                        .insert([skateData])
                        .select();

                    closeSkateModal();
                    await loadSkates();

                alert('Failed to save skate');

        async function loadRoster(skateId, capacity) {
            try {
                const { data, error } = await supabaseClient
                    .from('skate_registrations')
                    .select('*')
                    .eq('skate_id', skateId)
                    .order('position');

                if (error) throw error;

                const roster = data.filter(p => !p.is_waitlist);
                const waitlist = data.filter(p => p.is_waitlist);

                // Sort roster: goalies first, then skaters
                const sortedRoster = roster.sort((a, b) => {
                    if (a.is_goalie && !b.is_goalie) return -1;
                    if (!a.is_goalie && b.is_goalie) return 1;
                    return a.position - b.position;
                });

                // Count goalies and skaters
                const goalieCount = sortedRoster.filter(p => p.is_goalie).length;
                const skaterCount = sortedRoster.filter(p => !p.is_goalie).length;

                // Render roster
                const rosterList = document.getElementById('rosterList');
                if (sortedRoster.length === 0) {
                    rosterList.innerHTML = '<div style="color: #9ca3af; text-align: center; padding: 20px;">No players yet</div>';
                } else {
                    rosterList.innerHTML = sortedRoster.map(player => {
                        let classes = 'roster-item';
                        if (player.is_goalie) classes += ' goalie';
                        if (!player.is_paid) classes += ' unpaid';

                        return `
                            <div class="${classes}">
                                <span class="roster-item-name">${player.player_name} ${player.is_goalie ? '🥅' : ''}</span>
                                <div class="roster-item-actions">
                                    ${!player.is_goalie ? `<button class="icon-btn" onclick="toggleGoalie(${player.id}, true)" title="Mark as goalie">🥅</button>` : `<button class="icon-btn" onclick="toggleGoalie(${player.id}, false)" title="Remove goalie">👤</button>`}
                                    ${player.is_paid ? `<button class="icon-btn" onclick="togglePaid(${player.id}, false)" title="Mark unpaid">💵→❌</button>` : `<button class="icon-btn" onclick="togglePaid(${player.id}, true)" title="Mark paid">❌→💵</button>`}
                                    <button class="icon-btn" onclick="moveToWaitlist(${player.id})" title="Move to waitlist">⏸️</button>
                                    <button class="icon-btn" onclick="deletePlayer(${player.id})" title="Remove">🗑️</button>
                                </div>
                            </div>
                        `;
                    }).join('');
                }

                // Render waitlist
                const waitlistList = document.getElementById('waitlistList');
                if (waitlist.length === 0) {
                    waitlistList.innerHTML = '<div style="color: #9ca3af; text-align: center; padding: 20px;">No waitlist</div>';
                } else {
                    waitlistList.innerHTML = waitlist.map(player => `
                        <div class="roster-item waitlist">
                            <span class="roster-item-name">${player.player_name}</span>
                            <div class="roster-item-actions">
                                <button class="icon-btn" onclick="moveToRoster(${player.id})" title="Move to roster">▶️</button>
                                <button class="icon-btn" onclick="deletePlayer(${player.id})" title="Remove">🗑️</button>
                            </div>
                        </div>
                    `).join('');
                }

                // Update counts with Goalies and Skaters breakdown
                document.getElementById('rosterCount').textContent = `Goalies (${goalieCount}/2) · Skaters (${skaterCount}/${capacity - 2})`;
                document.getElementById('waitlistCount').textContent = `(${waitlist.length})`;

                // Update capacity bar
                const fillPercent = (sortedRoster.length / capacity) * 100;
                const fill = document.getElementById('capacityFill');
                fill.style.width = fillPercent + '%';
                if (sortedRoster.length >= capacity) {
                    fill.classList.add('capacity-full');
                } else {
                    fill.classList.remove('capacity-full');
                }

            } catch (error) {
                console.error('Error loading roster:', error);
            }
        }

        // CSV/ICS Import Functions
        let parsedCSVData = [];

        function showImportModal() {
            document.getElementById('csvFileInput').click();
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const fileName = file.name.toLowerCase();
            
            if (fileName.endsWith('.csv')) {
                handleCSVUpload(file);
            } else if (fileName.endsWith('.ics')) {
                handleICSUpload(file);
            } else {
                alert('Please upload a .csv or .ics file');
            }

            // Reset file input
            event.target.value = '';
        }

        function handleICSUpload(file) {
            const reader = new FileReader();
            
            reader.onload = function(e) {
                const icsContent = e.target.result;
                parsedCSVData = [];

                // Simple ICS parser
                const events = icsContent.split('BEGIN:VEVENT');
                
                events.forEach(event => {
                    if (!event.includes('DTSTART')) return;

                    // Extract SUMMARY (title)
                    const summaryMatch = event.match(/SUMMARY:(.+)/);
                    if (!summaryMatch) return;
                    
                    const summary = summaryMatch[1].trim();
                    
                    // Parse "Scrimmage: Skate 195: Tier 3 Beginner" format
                    let skateNumber = '';
                    let tier = '';
                    
                    const skateMatch = summary.match(/Skate\s+(\d+):\s*(.+)/i);
                    if (skateMatch) {
                        skateNumber = skateMatch[1];
                        tier = skateMatch[2].trim();
                    } else {
                        // No skate number, just use summary after "Scrimmage:"
                        const parts = summary.split(':');
                        tier = parts.length > 1 ? parts.slice(1).join(':').trim() : summary;
                    }

                    // Extract DTSTART
                    const dtstartMatch = event.match(/DTSTART[^:]*:(\d{8})T(\d{6})/);
                    if (!dtstartMatch) return;

                    const dateStr = dtstartMatch[1]; // YYYYMMDD
                    const timeStr = dtstartMatch[2]; // HHMMSS

                    const year = dateStr.slice(0, 4);
                    const month = dateStr.slice(4, 6);
                    const day = dateStr.slice(6, 8);
                    const date = `${year}-${month}-${day}`;

                    const hours = timeStr.slice(0, 2);
                    const minutes = timeStr.slice(2, 4);
                    const startTime = `${hours}:${minutes}`;

                    // Extract DTEND
                    const dtendMatch = event.match(/DTEND[^:]*:(\d{8})T(\d{6})/);
                    let endTime = startTime;
                    if (dtendMatch) {
                        const endTimeStr = dtendMatch[2];
                        const endHours = endTimeStr.slice(0, 2);
                        const endMinutes = endTimeStr.slice(2, 4);
                        endTime = `${endHours}:${endMinutes}`;
                    }

                    // Extract LOCATION (first line only, before newline or address)
                    const locationMatch = event.match(/LOCATION:([^\n\\]+)/);
                    let location = '';
                    if (locationMatch) {
                        location = locationMatch[1].trim().split('\\n')[0].trim();
                    }

                    // Build title
                    const title = skateNumber && tier 
                        ? `Skate ${skateNumber} ${tier}` 
                        : tier || 'Untitled';

                    parsedCSVData.push({
                        title: title,
                        tier: tier,
                        date: date,
                        time_start: startTime,
                        time_end: endTime,
                        location: location || '',
                        cost: '$25',
                        capacity: 24
                    });
                });

                if (parsedCSVData.length === 0) {
                    alert('No valid skates found in ICS file');
                    return;
                }

                showCSVPreview();
            };

            reader.readAsText(file);
        }

        function handleCSVUpload(file) {
            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    console.log('CSV parsed:', results);
                    parsedCSVData = [];

                    results.data.forEach((row, index) => {
                        // Skip rows with no date
                        if (!row.Date || !row.Time) return;

                        // Parse date (DD/MM/YYYY format)
                        const dateParts = row.Date.split('/');
                        if (dateParts.length !== 3) return;

                        const day = dateParts[0];
                        const month = dateParts[1];
                        const year = dateParts[2];
                        const date = `${year}-${month.padStart(2, '0')}-${day.padStart(2, '0')}`;

                        // Parse time (e.g., "7:45 PM")
                        const timeMatch = row.Time.match(/(\d+):(\d+)\s*(AM|PM)/i);
                        if (!timeMatch) return;

                        let hours = parseInt(timeMatch[1]);
                        const minutes = timeMatch[2];
                        const ampm = timeMatch[3].toUpperCase();

                        // Convert to 24hr
                        if (ampm === 'PM' && hours !== 12) hours += 12;
                        if (ampm === 'AM' && hours === 12) hours = 0;

                        const startTime = `${hours.toString().padStart(2, '0')}:${minutes}`;

                        // Calculate end time from duration (e.g., "1:30")
                        let endTime = startTime;
                        if (row.Duration) {
                            const durationParts = row.Duration.split(':');
                            const durationHours = parseInt(durationParts[0]) || 0;
                            const durationMins = parseInt(durationParts[1]) || 0;
                            
                            const startDate = new Date(`2000-01-01T${startTime}`);
                            startDate.setHours(startDate.getHours() + durationHours);
                            startDate.setMinutes(startDate.getMinutes() + durationMins);
                            
                            endTime = startDate.toTimeString().slice(0, 5);
                        }

                        parsedCSVData.push({
                            title: row['Title (Optional)'] || '',
                            tier: row['Title (Optional)'] || '',
                            date: date,
                            time_start: startTime,
                            time_end: endTime,
                            location: row['Location (Optional)'] || '',
                            cost: '$25',
                            capacity: 24
                        });
                    });

                    if (parsedCSVData.length === 0) {
                        alert('No valid skates found in CSV');
                        return;
                    }

                    showCSVPreview();
                },
                error: function(error) {
                    console.error('CSV parse error:', error);
                    alert('Failed to parse CSV file');
                }
            });
        }

        function showCSVPreview() {
            const content = document.getElementById('csvPreviewContent');
            
            content.innerHTML = `
                <p style="color: #60a5fa; font-weight: 600; margin-bottom: 12px;">

                </p>
                <div style="max-height: 400px; overflow-y: auto; background: rgba(0,0,0,0.3); border-radius: 8px; padding: 12px;">
                    ${parsedCSVData.map((skate, i) => `
                        <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px; margin-bottom: 8px; background: rgba(255,255,255,0.05); border-radius: 6px;">
                            <div style="flex: 1;">
                                <div style="font-weight: 600; color: #e8eaed;">${i + 1}. ${skate.tier || skate.title || 'Untitled'}</div>
                                <div style="font-size: 13px; color: #9ca3af; margin-top: 4px;">
                                    📅 ${new Date(skate.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}
                                    • 🕐 ${skate.time_start} - ${skate.time_end}
                                    • 📍 ${skate.location || 'No location'}
                                </div>
                            </div>
                            <button onclick="removeFromImport(${i})" style="background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #ef4444; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-left: 12px;">Remove</button>
                        </div>
                    `).join('')}
                </div>
            `;

            document.getElementById('importCSVButton').style.display = 'block';
            document.getElementById('csvPreviewModal').classList.add('active');
        }

        function removeFromImport(index) {
            parsedCSVData.splice(index, 1);
            if (parsedCSVData.length === 0) {
                closeCSVPreviewModal();
                alert('No skates left to import');
            } else {
                showCSVPreview(); // Refresh preview
            }
        }

        async function importCSVSkates() {
            try {
                const { data, error } = await supabaseClient
                    .from('skates')
                    .insert(parsedCSVData)
                    .select();

                if (error) throw error;

                closeCSVPreviewModal();
                await loadSkates();
                alert(`✓ Imported ${parsedCSVData.length} skate(s)!`);
                parsedCSVData = [];
            } catch (error) {
                console.error('Error importing skates:', error);
                alert('Failed to import skates');
            }
        }

        function closeCSVPreviewModal() {
            document.getElementById('csvPreviewModal').classList.remove('active');
            document.getElementById('importCSVButton').style.display = 'none';
            parsedCSVData = [];
        }

        async function balanceSkate() {
            // Get roster
            const { data, error } = await supabaseClient
                .from('skate_registrations')
                .select('*')
                .eq('skate_id', currentSkateId)
                .eq('is_waitlist', false)
                .order('position');

            if (error || !data) {
                alert('Failed to load roster');
                return;
            }

            // Sort: goalies first, then skaters
            const sortedData = data.sort((a, b) => {
                if (a.is_goalie && !b.is_goalie) return -1;
                if (!a.is_goalie && b.is_goalie) return 1;
                return a.position - b.position;
            });

            // Build player list string with goalies at top
            const playerList = sortedData.map(p => {
                let line = p.player_name;
                if (p.is_goalie) line += ' g';
                return line;
            }).join('\n');

            // Store in localStorage to pass to balancer
            localStorage.setItem('importedRoster', playerList);
            
            // Get skate details
            const skate = allSkates.find(s => s.id === currentSkateId);
            if (skate) {
                localStorage.setItem('importedSkateDetails', JSON.stringify({
                    title: skate.title,
                    date: formatDate(skate.date),
                    time: `${formatTime(skate.time_start)}–${formatTime(skate.time_end)}`,
                    cost: skate.cost,
                    location: skate.location
                }));
            }

            // Set flag for auto-load
            localStorage.setItem('autoLoadRoster', 'true');

            // Redirect to balancer
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
